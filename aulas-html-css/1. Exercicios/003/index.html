<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga de imagens</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logo-html-149.png" alt="Logo HTML5"> <!-- diminuir tamanho da img -->

    <img src="subpasta/logo-css-149.png" alt="Logo CSS"> <!-- diminuir tamanho da img -->

    <img src="https://cdn.iconscout.com/icon/free/png-512/free-javascript-logo-icon-svg-download-png-2284965.png?f=webp&w=512" alt="Logo Javascript"> <!-- URL -->
